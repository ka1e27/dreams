name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ---- Python: lint + test Pi 5 code ----
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r pi5/requirements.txt
          pip install ruff

      - name: Lint Pi 5 code
        run: ruff check pi5/

      - name: Run Pi 5 tests
        env:
          PYTHONPATH: .
        run: pytest pi5/tests/ -v --tb=short

  # ---- Cloud API: lint + integration test against PostGIS ----
  cloud-api:
    runs-on: ubuntu-latest
    # Always run on push/PR. (The old `contains(head_commit.modified, 'cloud/api')`
    # filter never matched — `contains` on a list does exact element matching, so
    # it never equalled a real path like 'cloud/api/app.py', and these jobs were
    # silently skipped on every push.)
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: boat
          POSTGRES_PASSWORD: boat
          POSTGRES_DB: boatdata
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U boat -d boatdata"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libgeos-dev

      - name: Install Python deps
        run: |
          pip install -r cloud/api/requirements.txt
          pip install httpx pytest ruff

      - name: Lint cloud API
        run: ruff check cloud/api/

      - name: Test cloud API health endpoint
        env:
          DATABASE_URL: postgresql://boat:boat@localhost:5432/boatdata
        run: |
          cd cloud/api
          python -c "
          from app import app
          from database import init_db
          init_db()
          print('Database initialized successfully')
          "

  # ---- Dashboard: lint + build ----
  dashboard:
    runs-on: ubuntu-latest
    # Always run on push/PR (see note on the cloud-api job — the old path filter never matched).
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: dashboard
        run: npm install

      - name: Build
        working-directory: dashboard
        run: npm run build

  # ---- Map Viewer: lint + build ----
  map-viewer:
    runs-on: ubuntu-latest
    # Always run on push/PR (see note on the cloud-api job — the old path filter never matched).
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: cloud/map-viewer
        run: npm install

      - name: Build
        working-directory: cloud/map-viewer
        run: npm run build
