bar load cell + HX711</text><line class="dim" x1="124.00" y1="101.41" x2="98.00" y2="111.41" marker-end="url(#a)"/><text x="125.00" y="102.21" font-size="2.3" text-anchor="start">the boat&#x27;s outdrive: bracket bolted to the arm</text><line class="dim" x1="124.00" y1="111.41" x2="101.00" y2="120.41" marker-end="url(#a)"/><text x="125.00" y="112.21" font-size="2.3" text-anchor="start">motor dry above the water</text><text x="87.00" y="152.21" font-size="2.0" text-anchor="end">leg 80 x 28, belt inside</text><text x="90.00" y="226.00" font-size="3.1" text-anchor="middle" font-weight="bold">SIDE VIEW</text><text x="90.00" y="229.70" font-size="2.2" text-anchor="middle">SCALE 1:5</text><text x="215.00" y="25.00" font-size="2.3" text-anchor="start">HOW IT WORKS</text><text x="215.00" y="28.70" font-size="2.3" text-anchor="start">Thrust T at the prop axis turns the arm about the pivot; the arm&#x27;s top presses the</text><text x="215.00" y="32.40" font-size="2.3" text-anchor="start">load cell. With equal arms the load-cell force equals T (F = T x 380 / 370 here).</text><text x="215.00" y="36.10" font-size="2.3" text-anchor="start"></text><text x="215.00" y="39.80" font-size="2.3" text-anchor="start">PROCEDURE</text><text x="215.00" y="43.50" font-size="2.3" text-anchor="start">1. Calibrate: hang known weights from a string over a pulley at the prop axis.</text><text x="215.00" y="47.20" font-size="2.3" text-anchor="start">2. Power one outdrive from one M18 pack through a VESC; log current, voltage and rpm</text><text x="215.00" y="50.90" font-size="2.3" text-anchor="start">   with VESC Tool&#x27;s real-time data, and thrust from the HX711 (Pico or Arduino).</text><text x="215.00" y="54.60" font-size="2.3" text-anchor="start">3. For each prop, step the rpm 1000 -&gt; 4000 in 500 rpm steps, 10 s per step.</text><text x="215.00" y="58.30" font-size="2.3" text-anchor="start">4. Plot thrust vs electrical power. Compare props at the same thrust:</text><text x="215.00" y="62.00" font-size="2.3" text-anchor="start">   ~5 N (1 m/s cruise), ~10 N (1.5 m/s), ~25 N (3 m/s) per drive.</text><text x="215.00" y="65.70" font-size="2.3" text-anchor="start">5. Weed test: hang loose strands upstream at 1500 rpm for 2 min; count wraps.</text><text x="215.00" y="69.40" font-size="2.3" text-anchor="start"></text><text x="215.00" y="73.10" font-size="2.3" text-anchor="start">Keep the prop &gt;= 1.5 D below the surface and &gt;= 2 D from the walls and floor;</text><text x="215.00" y="76.80" font-size="2.3" text-anchor="start">a tote gives fair comparisons between props, not absolute numbers.</text><text x="215.00" y="80.50" font-size="2.3" text-anchor="start">A plain 110 mm RC boat prop = baseline. Record water temperature and belt tension.</text><text x="215.00" y="84.20" font-size="2.3" text-anchor="start"></text><text x="215.00" y="87.90" font-size="2.3" text-anchor="start">PARTS</text><text x="215.00" y="91.60" font-size="2.3" text-anchor="start">2020 extrusion (~1.5 m) + corner brackets; 8 mm shaft + 2x KFL08 bearings;</text><text x="215.00" y="95.30" font-size="2.3" text-anchor="start">10 kg bar load cell + HX711; 27-gal tote; one of the boat&#x27;s outdrives, a VESC,</text><text x="215.00" y="99.00" font-size="2.3" text-anchor="start">one M18 pack, 20 A blade fuse and a kill switch.</text><rect class="grid" x="215.00" y="118.00" width="156.00" height="30.00"/><line class="dimx" x1="215.00" y1="123.00" x2="371.00" y2="123.00"/><line class="dimx" x1="215.00" y1="128.00" x2="371.00" y2="128.00"/><line class="dimx" x1="215.00" y1="133.00" x2="371.00" y2="133.00"/><line class="dimx" x1="215.00" y1="138.00" x2="371.00" y2="138.00"/><line class="dimx" x1="215.00" y1="143.00" x2="371.00" y2="143.00"/><line class="dimx" x1="233.00" y1="118.00" x2="233.00" y2="148.00"/><line class="dimx" x1="247.00" y1="118.00" x2="247.00" y2="148.00"/><line class="dimx" x1="261.00" y1="118.00" x2="261.00" y2="148.00"/><line class="dimx" x1="275.00" y1="118.00" x2="275.00" y2="148.00"/><line class="dimx" x1="295.00" y1="118.00" x2="295.00" y2="148.00"/><line class="dimx" x1="311.00" y1="118.00" x2="311.00" y2="148.00"/><text x="216.20" y="121.60" font-size="2.2" text-anchor="start" font-weight="bold">rpm</text><text x="234.20" y="121.60" font-size="2.2" text-anchor="start" font-weight="bold">V</text><text x="248.20" y="121.60" font-size="2.2" text-anchor="start" font-weight="bold">A</text><text x="262.20" y="121.60" font-size="2.2" text-anchor="start" font-weight="bold">W</text><text x="276.20" y="121.60" font-size="2.2" text-anchor="start" font-weight="bold">thrust N</text><text x="296.20" y="121.60" font-size="2.2" text-anchor="start" font-weight="bold">g/W</text><text x="312.20" y="121.60" font-size="2.2" text-anchor="start" font-weight="bold">notes</text><text x="216.20" y="126.60" font-size="2.2" text-anchor="start">1000</text><text x="234.20" y="126.60" font-size="2.2" text-anchor="start"></text><text x="248.20" y="126.60" font-size="2.2" text-anchor="start"></text><text x="262.20" y="126.60" font-size="2.2" text-anchor="start"></text><text x="276.20" y="126.60" font-size="2.2" text-anchor="start"></text><text x="296.20" y="126.60" font-size="2.2" text-anchor="start"></text><text x="312.20" y="126.60" font-size="2.2" text-anchor="start"></text><text x="216.20" y="131.60" font-size="2.2" text-anchor="start">1500</text><text x="234.20" y="131.60" font-size="2.2" text-anchor="start"></text><text x="248.20" y="131.60" font-size="2.2" text-anchor="start"></text><text x="262.20" y="131.60" font-size="2.2" text-anchor="start"></text><text x="276.20" y="131.60" font-size="2.2" text-anchor="start"></text><text x="296.20" y="131.60" font-size="2.2" text-anchor="start"></text><text x="312.20" y="131.60" font-size="2.2" text-anchor="start"></text><text x="216.20" y="136.60" font-size="2.2" text-anchor="start">2000</text><text x="234.20" y="136.60" font-size="2.2" text-anchor="start"></text><text x="248.20" y="136.60" font-size="2.2" text-an
