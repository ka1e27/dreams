nchor="middle">220</text><line class="dimx" x1="312.00" y1="172.00" x2="312.00" y2="207.79"/><line class="dimx" x1="360.00" y1="172.00" x2="360.00" y2="207.79"/><line class="dim" x1="312.00" y1="206.29" x2="360.00" y2="206.29" marker-start="url(#a)" marker-end="url(#a)"/><text x="336.00" y="205.49" font-size="2.5" text-anchor="middle">480 tunnel</text><line class="dimx" x1="357.00" y1="186.09" x2="392.25" y2="186.09"/><line class="dimx" x1="357.00" y1="165.00" x2="392.25" y2="165.00"/><line class="dim" x1="390.75" y1="161.00" x2="390.75" y2="190.09"/><line class="dim" x1="390.75" y1="161.00" x2="390.75" y2="165.00" marker-end="url(#a)"/><line class="dim" x1="390.75" y1="190.09" x2="390.75" y2="186.09" marker-end="url(#a)"/><text x="391.95" y="192.59" font-size="2.5" text-anchor="start">211 hub over DWL</text><text x="289.00" y="195.20" font-size="1.9" text-anchor="end">12° deadrise, R50 chine</text><text x="336.00" y="162.50" font-size="1.8" text-anchor="middle">frame (hidden)</text><text x="336.00" y="215.29" font-size="3.1" text-anchor="middle" font-weight="bold">VIEW FROM ASTERN</text><text x="336.00" y="218.99" font-size="2.2" text-anchor="middle">SCALE 1:10</text><text x="216.00" y="20.00" font-size="3.0" text-anchor="start" font-weight="bold">MODULES</text><rect class="grid" x="216.00" y="23.00" width="194.00" height="20.00"/><line class="dimx" x1="216.00" y1="27.00" x2="410.00" y2="27.00"/><line class="dimx" x1="216.00" y1="31.00" x2="410.00" y2="31.00"/><line class="dimx" x1="216.00" y1="35.00" x2="410.00" y2="35.00"/><line class="dimx" x1="216.00" y1="39.00" x2="410.00" y2="39.00"/><line class="dimx" x1="242.00" y1="23.00" x2="242.00" y2="43.00"/><line class="dimx" x1="262.00" y1="23.00" x2="262.00" y2="43.00"/><text x="217.20" y="25.88" font-size="2.2" text-anchor="start" font-weight="bold">Module</text><text x="243.20" y="25.88" font-size="2.2" text-anchor="start" font-weight="bold">Design kg</text><text x="263.20" y="25.88" font-size="2.2" text-anchor="start" font-weight="bold">Contents</text><text x="217.20" y="29.88" font-size="2.2" text-anchor="start">Port tub</text><text x="243.20" y="29.88" font-size="2.2" text-anchor="start">7.1</text><text x="263.20" y="29.88" font-size="2.2" text-anchor="start">3 PLA segments + bulkheads, flange with 37 M4 inserts; drive pack, VESC, heat plate, leak probe, thrust pad</text><text x="217.20" y="33.88" font-size="2.2" text-anchor="start">Stbd tub</text><text x="243.20" y="33.88" font-size="2.2" text-anchor="start">6.6</text><text x="263.20" y="33.88" font-size="2.2" text-anchor="start">the same shell; electronics + winch packs, Pi 5 + carrier, VESC, heat plate</text><text x="217.20" y="37.88" font-size="2.2" text-anchor="start">Upper module</text><text x="243.20" y="37.88" font-size="2.2" text-anchor="start">20.5</text><text x="263.20" y="37.88" font-size="2.2" text-anchor="start">bridge (arch frames, arms, hub garage: winch, pod, Van Dorn; mast, cameras) + 2 lids + 2 belt outdrives</text><text x="217.20" y="41.88" font-size="2.2" text-anchor="start">Boat</text><text x="243.20" y="41.88" font-size="2.2" text-anchor="start">34.3</text><text x="263.20" y="41.88" font-size="2.2" text-anchor="start">incl. 10% growth margin and a 2 L water sample; no robot arm</text><text x="216.00" y="52.00" font-size="2.3" text-anchor="start" font-weight="bold">ASSEMBLY</text><text x="216.00" y="55.50" font-size="2.3" text-anchor="start">1. Fit each tub&#x27;s heat plate, packs and electronics, the leak probe (sheet 4) and the drive&#x27;s thrust pad (sheet 6).</text><text x="216.00" y="59.00" font-size="2.3" text-anchor="start">2. Bolt each foot to its lid from inside: 8x M6 x 60 up through the rib bosses, EPDM pad between.</text><text x="216.00" y="62.50" font-size="2.3" text-anchor="start">3. Bolt each outdrive mount to its lid from inside: 4x M5 up through the aft deck, 2x through the aft wall.</text><text x="216.00" y="66.00" font-size="2.3" text-anchor="start">4. Press the 3 mm cord into each tub&#x27;s flange groove.</text><text x="216.00" y="69.50" font-size="2.3" text-anchor="start">5. Hold the bridge + lids just above the tubs, plug the lid connectors inside, lower it; the drip lips locate.</text><text x="216.00" y="73.00" font-size="2.3" text-anchor="start">6. Screw down the rails: 37 M4 per hull, 60 mm pitch within 150 mm of a frame, 100 elsewhere.</text><text x="216.00" y="76.50" font-size="2.3" text-anchor="start"></text><text x="216.00" y="80.00" font-size="2.3" text-anchor="start">Waterlines: DWL 99 at 34.3 kg; thin blue = light 86 / max 110. Lid joint 91 above the DWL.</text><text x="216.00" y="83.50" font-size="2.3" text-anchor="start">Wiring enters each hull only through IP68 bulkhead connectors in its lid. The packs sit low,</text><text x="216.00" y="87.00" font-size="2.3" text-anchor="start">on aluminium plates on the hull bottoms, so the water carries their heat away.</text><text x="216.00" y="90.50" font-size="2.3" text-anchor="start">Geometry comes from mechanical/hull_sizing.py; regenerate after changes.</text><text x="243.80" y="238.40" font-size="3.2" text-anchor="start" font-weight="bold">D.R.E.A.M.S — autonomous survey catamaran</text><text x="243.80" y="243.40" font-size="3.0" text-anchor="start">General arrangement: plan, profile, view from astern</text><text x="243.80" y="250.40" font-size="2.2" text-anchor="start">All dimensions mm unless noted. Third-angle projection. Do not scale the print; build from the numbers.</text><text x="243.80" y="258.60" font-size="2.4" text-anchor="start">SCALE  1:10</text><text x="303.80" y="258.60" font-size="2.4" text-anchor="start">SHEET  1 OF 7</text><text x="363.80" y="258.60" font-size="2.4" text-anchor="start">REV  D (hub garage, packs in the hulls, fixed drives)</text><text x="243.80" y="266.60" font-size="2.4" text-anchor="start">DATE  2026-10-02</text><text x="303.80" y="266.60" font-size="2.4" text-anchor="start">DRAWN  Claude Code for M. Hong</text><text x="363.80" y="266.60" font-s art">52.2</text><text x="149.20" y="230.88" font-size="2.0" text-anchor="start">36.4</text><text x="169.20" y="230.88" font-size="2.0" text-anchor="start">16 / 16</text><text x="109.20" y="234.88" font-size="2.0" text-anchor="start">1250</text><text x="121.20" y="234.88" font-size="2.0" text-anchor="start">76.0</text><text x="135.20" y="234.88" font-size="2.0" text-anchor="start">79.1</text><text x="149.20" y="234.88" font-size="2.0" text-anchor="start">14.8</text><text x="169.20" y="234.88" font-size="2.0" text-anchor="start">7 / 7</text><text x="109.20" y="238.88" font-size="2.0" text-anchor="start">1300</text><text x="121.20" y="238.88" font-size="2.0" text-anchor="start">100.0</text><text x="135.20" y="238.88" font-size="2.0" text-anchor="start">101.1</text><text x="149.20" y="238.88" font-size="2.0" text-anchor="start">5.0</text><text x="169.20" y="238.88" font-size="2.0" text-anchor="start">2 / 2</text><text x="200.00" y="198.00" font-size="2.0" text-anchor="start" font-weight="bold">CONSTRUCTION (open tub + removable lid)</text><text x="200.00" y="201.20" font-size="2.0" text-anchor="start">- Loft the sharp-chine hull from the offsets, fillet chine R50 and deck edge R50 (0.45 x half-breadth near the stem), split at the lid joint plane z 190.</text><text x="200.00" y="204.40" font-size="2.0" text-anchor="start">- PLA on the Elegoo OrangeStorm Giga: 0.6-0.8 nozzle, 4 walls (2.4), +3-5 % flow. Glass outside (200 g/m2; 2nd layer on keel, chines, stem), 2 coats epoxy inside.</text><text x="200.00" y="207.60" font-size="2.0" text-anchor="start">- Tub: 3 segments (520 / 260 / 520) split at the frames, each printed standing on its aft 2.4 bulkhead (the first on the transom).</text><text x="200.00" y="210.80" font-size="2.0" text-anchor="start">  Bulkheads stop 5 under the joint plane, with limber holes at their feet so a leak runs to the probe.</text><text x="200.00" y="214.00" font-size="2.0" text-anchor="start">- Lid: 3 segments on end; lid segments 2 and 3 stand on their 8 mm ribs (J1 / J2) with the foot-bolt bosses.</text><text x="200.00" y="217.20" font-size="2.0" text-anchor="start">- Joints J1, J2: 8 mm half-lap spigots, bonded with thickened epoxy (sheet 3). Epoxy only, slow hardener: PLA softens ~55 C.</text><text x="200.00" y="220.40" font-size="2.0" text-anchor="start">- Rail: 15 mm flanges, 3 mm cord in a 5 x 2.2 groove, 37x M4 into heat-set inserts (sheet 4); epoxy and sand the flange: layer lines cross the gasket.</text><text x="200.00" y="223.60" font-size="2.0" text-anchor="start">- One sealed space per hull: leak probe at the keel low point (carrier J8 port / J9 stbd), M12 vent in the lid.</text><text x="200.00" y="226.80" font-size="2.0" text-anchor="start">- Shell 4.6 kg per hull incl. bulkheads, ribs, stiffeners, glass, epoxy, + 1.0 kg rail. Pressure-test (&lt;= 0.03 bar) before fitting out.</text><text x="243.80" y="238.40" font-size="3.2" text-anchor="start" font-weight="bold">D.R.E.A.M.S — autonomous survey catamaran</text><text x="243.80" y="243.40" font-size="3.0" text-anchor="start">Demi-hull lines, lid joint plane, print segments, offsets and fillets</text><text x="243.80" y="250.40" font-size="2.2" text-anchor="start">All dimensions mm unless noted. Third-angle projection. Do not scale the print; build from the numbers.</text><text x="243.80" y="258.60" font-size="2.4" text-anchor="start">SCALE  1:5 / 1:2.5</text><text x="303.80" y="258.60" font-size="2.4" text-anchor="start">SHEET  2 OF 7</text><text x="363.80" y="258.60" font-size="2.4" text-anchor="start">REV  D (hub garage, packs in the hulls, fixed drives)</text><text x="243.80" y="266.60" font-size="2.4" text-anchor="start">DATE  2026-10-02</text><text x="303.80" y="266.60" font-size="2.4" text-anchor="start">DRAWN  Claude Code for M. Hong</text><text x="363.80" y="266.60" font-size="2.4" text-anchor="start">SRC  mechanical/drawings.py</text></svg></div><div class="page"><svg xmlns="http://www.w3.org/2000/svg" width="431.8mm" height="279.4mm" v 25.09 356.50,225.00"/><text x="344.00" y="162.50" font-size="1.9" text-anchor="middle">stbd tub at x 650</text><text x="226.00" y="151.00" font-size="1.8" text-anchor="start">SECTIONS AT x 650, looking fwd, 1:4: the heat plate is bedded on thickened epoxy (blue) on the</text><text x="226.00" y="153.70" font-size="1.8" text-anchor="start">V bottom, the packs sit on the plate. DWL dashed blue, lid joint purple.</text><text x="20.00" y="174.00" font-size="1.95" text-anchor="start" font-weight="bold">WIRING (everything enters a hull through its lid connectors)</text><text x="20.00" y="177.15" font-size="1.95" text-anchor="start">- 12S: drive pack (port) -&gt; port VESC; to the stbd VESC across the bridge (port arm, hub, stbd arm).</text><text x="20.00" y="180.30" font-size="1.95" text-anchor="start">- CAN: carrier (stbd) -&gt; stbd VESC -&gt; across the bridge -&gt; port VESC (node IDs 1, 2).</text><text x="20.00" y="183.45" font-size="1.95" text-anchor="start">- Electronics pack (stbd) -&gt; carrier -&gt; Pi 5 on the carrier&#x27;s 5 V. Never also power the Pi from USB-C.</text><text x="20.00" y="186.60" font-size="1.95" text-anchor="start">- Winch pack (stbd) -&gt; carrier&#x27;s fail-safe winch kill -&gt; up the stbd arm -&gt; winch in the hub garage.</text><text x="20.00" y="189.75" font-size="1.95" text-anchor="start">- Pod tether (RS-485 + pack voltage) from carrier J2 -&gt; up the stbd arm -&gt; the winch&#x27;s slip ring.</text><text x="20.00" y="192.90" font-size="1.95" text-anchor="start">- Mast (GNSS, LTE, WiFi), stereo cameras, e-stop -&gt; down the stbd arm. Leak probes: J8 port, J9 stbd.</text><text x="20.00" y="196.05" font-size="1.95" text-anchor="start">- Motor wires: outdrive -&gt; lid connector at x 100 -&gt; that hull&#x27;s VESC.</text><text x="20.00" y="199.20" font-size="1.95" text-anchor="start"></text><text x="20.00" y="202.35" font-size="1.95" text-anchor="start">HEAT AND WATER</text><text x="20.00" y="205.50" font-size="1.95" text-anchor="start">- VESCs and packs sit on 6061 plates bedded on the hull bottom, so the water takes the heat; PLA</text><text x="20.00" y="208.65" font-size="1.95" text-anchor="start">  softens ~55 C. Log the hull air temperature (the carrier&#x27;s SHT45s).</text><text x="20.00" y="211.80" font-size="1.95" text-anchor="start">- Limber holes at the bulkhead feet send any leak to the probe at x 850, forward of the packs.</text><text x="20.00" y="214.95" font-size="1.95" text-anchor="start">- Lifting a lid: unscrew the rail, raise it ~100 mm on the connector slack, unplug inside, lift away.</text><text x="243.80" y="238.40" font-size="3.2" text-anchor="start" font-weight="bold">D.R.E.A.M.S — autonomous survey catamaran</text><text x="243.80" y="243.40" font-size="3.0" text-anchor="start">Hull lid joint (rail) and what goes inside each hull</text><text x="243.80" y="250.40" font-size="2.2" text-anchor="start">All dimensions mm unless noted. Third-angle projection. Do not scale the print; build from the numbers.</text><text x="243.80" y="258.60" font-size="2.4" text-anchor="start">SCALE  as noted</text><text x="303.80" y="258.60" font-size="2.4" text-anchor="start">SHEET  4 OF 7</text><text x="363.80" y="258.60" font-size="2.4" text-anchor="start">REV  D (hub garage, packs in the hulls, fixed drives)</text><text x="243.80" y="266.60" font-size="2.4" text-anchor="start">DATE  2026-10-02</text><text x="303.80" y="266.60" font-size="2.4" text-anchor="start">DRAWN  Claude Code for M. Hong</text><text x="363.80" y="266.60" font-size="2.4" text-anchor="start">SRC  mechanical/drawings.py</text></svg></div><div class="page"><svg xmlns="http://www.w3.org/2000/svg" width="431.8mm" height="279.4mm" viewBox="0 0 431.8 279.4"><style>

 x="340.50" y="83.70" font-size="2.2" text-anchor="middle">SCALE 1:1</text><text x="248.00" y="104.00" font-size="2.5" text-anchor="start" font-weight="bold">PURCHASED PARTS (per drive; 2 drives)</text><rect class="grid" x="248.00" y="106.50" width="172.00" height="35.75"/><line class="dimx" x1="248.00" y1="109.75" x2="420.00" y2="109.75"/><line class="dimx" x1="248.00" y1="113.00" x2="420.00" y2="113.00"/><line class="dimx" x1="248.00" y1="116.25" x2="420.00" y2="116.25"/><line class="dimx" x1="248.00" y1="119.50" x2="420.00" y2="119.50"/><line class="dimx" x1="248.00" y1="122.75" x2="420.00" y2="122.75"/><line class="dimx" x1="248.00" y1="126.00" x2="420.00" y2="126.00"/><line class="dimx" x1="248.00" y1="129.25" x2="420.00" y2="129.25"/><line class="dimx" x1="248.00" y1="132.50" x2="420.00" y2="132.50"/><line class="dimx" x1="248.00" y1="135.75" x2="420.00" y2="135.75"/><line class="dimx" x1="248.00" y1="139.00" x2="420.00" y2="139.00"/><line class="dimx" x1="257.00" y1="106.50" x2="257.00" y2="142.25"/><line class="dimx" x1="266.00" y1="106.50" x2="266.00" y2="142.25"/><text x="249.20" y="108.84" font-size="1.85" text-anchor="start" font-weight="bold">No.</text><text x="258.20" y="108.84" font-size="1.85" text-anchor="start" font-weight="bold">Qty</text><text x="267.20" y="108.84" font-size="1.85" text-anchor="start" font-weight="bold">Item</text><text x="249.20" y="112.09" font-size="1.85" text-anchor="start">7</text><text x="258.20" y="112.09" font-size="1.85" text-anchor="start">1</text><text x="267.20" y="112.09" font-size="1.85" text-anchor="start">Outrunner, 41xx (46 x 32 can), 25 A+. KV: see the note</text><text x="249.20" y="115.34" font-size="1.85" text-anchor="start">8</text><text x="258.20" y="115.34" font-size="1.85" text-anchor="start">2</text><text x="267.20" y="115.34" font-size="1.85" text-anchor="start">HTD 3M pulley, 20T (19.1 PD), 9 mm belt; bores to the motor / 5 mm shaft</text><text x="249.20" y="118.59" font-size="1.85" text-anchor="start">9</text><text x="258.20" y="118.59" font-size="1.85" text-anchor="start">1</text><text x="267.20" y="118.59" font-size="1.85" text-anchor="start">HTD 3M belt, 9 mm, 205 T (615 mm), PU with aramid or stainless cords</text><text x="249.20" y="121.84" font-size="1.85" text-anchor="start">10</text><text x="258.20" y="121.84" font-size="1.85" text-anchor="start">2</text><text x="267.20" y="121.84" font-size="1.85" text-anchor="start">625-2RS bearing, stainless (5 x 16 x 5): they run wet</text><text x="249.20" y="125.09" font-size="1.85" text-anchor="start">11</text><text x="258.20" y="125.09" font-size="1.85" text-anchor="start">1</text><text x="267.20" y="125.09" font-size="1.85" text-anchor="start">Shaft collar, 5 mm bore, 10 OD x 5, set screw</text><text x="249.20" y="128.34" font-size="1.85" text-anchor="start">12</text><text x="258.20" y="128.34" font-size="1.85" text-anchor="start">1</text><text x="267.20" y="128.34" font-size="1.85" text-anchor="start">Prop 110 (props/toroidal_..._RH_shaft stbd, _LH_ port) + washer + M5 nylock A4</text><text x="249.20" y="131.59" font-size="1.85" text-anchor="start">13</text><text x="258.20" y="131.59" font-size="1.85" text-anchor="start">1</text><text x="267.20" y="131.59" font-size="1.85" text-anchor="start">IP68 bulkhead connector, 3-pin, in the lid&#x27;s aft deck at x 100</text><text x="249.20" y="134.84" font-size="1.85" text-anchor="start">-</text><text x="258.20" y="134.84" font-size="1.85" text-anchor="start"></text><text x="267.20" y="134.84" font-size="1.85" text-anchor="start">6x M5 x 20 A4 + washers (4 up through the deck, 2 through the aft wall), 3 mm Al backing plates</text><text x="249.20" y="138.09" font-size="1.85" text-anchor="start">-</text><text x="258.20" y="138.09" font-size="1.85" text-anchor="start"></text><text x="267.20" y="138.09" font-size="1.85" text-anchor="start">6x M5 heat-set inserts in the mount; 2x M4 x 40 A4 + nylocks across the socket</text><text x="249.20" y="141.34" font-size="1.85" text-anchor="start">-</text><text x="258.20" y="141.34" font-size="1.85" text-anchor="start"></text><text x="267.20" y="141.34" font-size="1.85" text-anchor="start">~12x M3 A4 + inserts (leg/pod halves, cover); 2x M4 x 8 (motor plate foot)</text><text x="248.00" y="150.00" font-size="1.85" text-anchor="start" font-weight="bold">NOTES</text><text x="248.00" y="152.75" font-size="1.85" text-anchor="start">- Print 1, 3 and 4 in ABS or ASA (the EXP S5 lists ABS), not PLA: the motor and the sun heat them.</text><text x="248.00" y="155.50" font-size="1.85" text-anchor="start">  6 walls or 100 % infill round the socket and the inserts. The mount can be milled from 6061 later.</text><text x="248.00" y="158.25" font-size="1.85" text-anchor="start">- Bond 6 to the transom with thickened epoxy; it carries the forward thrust. The leg lifts off with the</text><text x="248.00" y="161.00" font-size="1.85" text-anchor="start">  lid; nothing on the drive bolts to the tub.</text><text x="248.00" y="163.75" font-size="1.85" text-anchor="start">- Loads at 55 N forward: pad 131 N, mount 76 N, leg 6.5 N m at the pad (11.2 N m with no pad).</text><text x="248.00" y="166.50" font-size="1.85" text-anchor="start">- MOTOR KV. V3&#x27;s drive rail is 12S (~44 V). Rev C picked 380 KV for an 18 V pack; on 12S it</text><text x="248.00" y="169.25" font-size="1.85" text-anchor="start">  would run at ~10-25 % duty from cruise to top speed. ~150-200 KV suits 12S. Most motors with enough</text><text x="248.00" y="172.00" font-size="1.85" text-anchor="start">  power at that KV are a size up (50xx, ~55 dia): that fits the 70 cover with the motor axis ~5 mm up.</text><text x="248.00" y="174.75" font-size="1.85" text-anchor="start">  The drawings keep the 41xx envelope until you pick one.</text><text x="248.00" y="177.50" font-size="1.85" text-anchor="start"></text><text x="248.00" y="180.25" font-size="1.85" text-anchor="start">MODELING ORDER (SolidWorks)</text><text x="248.00" y="183.00" font-size="1.85" text-anchor="start">1. Drive assembly layout sketch on the Front plane: transom (x 0), deck (z 250), belt plane, motor and</text><text x="248.00" y="185.75" font-size="1.85" text-anchor="start">   prop axes. Origin = transom / baseline / hull CL, like the hull.</text><text x="248.00" y="188.50" font-size="1.85" text-anchor="start">2. Mount: extrude the side profile +/-17 (head block); add the deck and wall flanges +/-44 and the</text><text x="248.00" y="191.25" font-size="1.85" text-anchor="start">   platform +/-35; cut the socket (leg section + 0.2), the belt slot and the holes.</text><text x="248.00" y="194.00" font-size="1.85" text-anchor="start">3. Leg + pod: section A-A at z 38 extruded to 245; pod revolved on the prop axis; combine, cut the</text><text x="248.00" y="196.75" font-size="1.85" text-anchor="start">   pockets, split on y = 0. Mirror the half for the other side.</text><text x="248.00" y="199.50" font-size="1.85" text-anchor="start">4. Pad, plate, cover; then mate everything fixed and run Interference Detection.</text><text x="243.80" y="238.40" font-size="3.2" text-anchor="start" font-weight="bold">D.R.E.A.M.S — autonomous survey catamaran</text><text x="243.80" y="243.40" font-size="3.0" text-anchor="start">Belt outdrive (fixed), part by part (for CAD), purchased parts and modeling order</text><text x="243.80" y="250.40" font-size="2.2" text-anchor="start">All dimensions mm unless noted. Third-angle projection. Do not scale the print; build from the numbers.</text><text x="243.80" y="258.60" font-size="2.4" text-anchor="start">SCALE  as noted</text><text x="303.80" y="258.60" font-size="2.4" text-anchor="start">SHEET  6 OF 7</text><text x="363.80" y="258.60" font-size="2.4" text-anchor="start">REV  D (hub garage, packs in the hulls, fixed drives)</text><text x="243.80" y="266.60" font-size="2.4" text-anchor="start">DATE  2026-10-02</text><text x="303.80" y="266.60" font-size="2.4" text-anchor="start">DRAWN  Claude Code for M. Hong</text><text x="363.80" ODY PLAN (SHEET 2)</text><text x="250.00" y="23.35" font-size="2.1" text-anchor="start">Each coloured shape is one slice straight across ONE hull, like a slice of</text><text x="250.00" y="26.70" font-size="2.1" text-anchor="start">bread. Its number is where the slice is: mm forward of the transom.</text><text x="250.00" y="30.05" font-size="2.1" text-anchor="start"></text><text x="250.00" y="33.40" font-size="2.1" text-anchor="start">Sheet 2 stacks all the slices on one drawing. The hull is the same on both</text><text x="250.00" y="36.75" font-size="2.1" text-anchor="start">sides, so it draws only half of each slice: the stern half of the boat on</text><text x="250.00" y="40.10" font-size="2.1" text-anchor="start">the left of the centreline, the bow half on the right, in these colours.</text><text x="250.00" y="43.45" font-size="2.1" text-anchor="start"></text><text x="250.00" y="46.80" font-size="2.1" text-anchor="start">Reading from stern to bow:</text><text x="250.00" y="50.15" font-size="2.1" text-anchor="start">- 0 to 520: the same shape, but the keel lifts toward the transom</text><text x="250.00" y="53.50" font-size="2.1" text-anchor="start">  (+40 mm at 0), so the stern draws less water.</text><text x="250.00" y="56.85" font-size="2.1" text-anchor="start">- 520 to 650: the widest part (220 mm), keel on the baseline.</text><text x="250.00" y="60.20" font-size="2.1" text-anchor="start">- 650 to 1300: it narrows toward the bow; from 910 the keel</text><text x="250.00" y="63.55" font-size="2.1" text-anchor="start">  also rises, to +100 at the bow, which ends in a 10 mm flat face.</text><text x="250.00" y="66.90" font-size="2.1" text-anchor="start"></text><text x="250.00" y="70.25" font-size="2.1" text-anchor="start">In each box: blue dashes = waterline (99), purple = lid joint (190).</text><text x="250.00" y="73.60" font-size="2.1" text-anchor="start">In SolidWorks, each box is one sketch on a plane at that x (guide, A2).</text><text x="50.00" y="103.00" font-size="2.3" text-anchor="middle" font-weight="bold" style="fill:#1f4e9c">STATION 0</text><text x="50.00" y="106.30" font-size="1.7" text-anchor="middle">the transom itself</text><line class="thin" x1="29.17" y1="155.17" x2="70.83" y2="155.17"/><line class="wl" x1="29.17" y1="138.66" x2="70.83" y2="138.66"/><line class="lidj" x1="29.17" y1="123.50" x2="70.83" y2="123.50"/><line class="ctr" x1="50.00" y1="156.50" x2="50.00" y2="112.83"/><polygon class="vis" style="stroke:#1f4e9c;fill:#1f4e9c;fill-opacity:0.12" points="50.00,148.50 51.97,148.08 53.93,147.66 55.90,147.25 57.87,146.83 59.83,146.41 61.80,145.99 62.88,145.68 63.91,145.23 64.86,144.65 65.73,143.94 66.49,143.11 67.14,142.20 67.65,141.20 68.03,140.14 68.26,139.04 68.33,137.92 68.33,135.90 68.33,133.88 68.33,131.86 68.33,129.84 68.33,127.81 68.33,125.79 68.33,123.77 68.33,121.75 68.05,119.61 67.23,117.62 65.92,115.92 64.21,114.61 62.22,113.78 60.08,113.50 58.07,113.50 56.05,113.50 54.03,113.50 52.02,113.50 50.00,113.50 47.98,113.50 45.97,113.50 43.95,113.50 41.93,113.50 39.92,113.50 37.78,113.78 35.79,114.61 34.08,115.92 32.77,117.62 31.95,119.61 31.67,121.75 31.67,123.77 31.67,125.79 31.67,127.81 31.67,129.84 31.67,131.86 31.67,133.88 31.67,135.90 31.67,137.92 31.74,139.04 31.97,140.14 32.35,141.20 32.86,142.20 33.51,143.11 34.27,143.94 35.14,144.65 36.09,145.23 37.12,145.68 38.20,145.99 40.17,146.41 42.13,146.83 44.10,147.25 46.07,147.66 48.03,148.08"/><line class="dimx" x1="31.67" y1="120.75" x2="31.67" y2="108.90"/><line class="dimx" x1="68.33" y1="120.75" x2="68.33" y2="108.90"/><line class="dim" x1="31.67" y1="110.40" x2="68.33" y2="110.40" marker-start="url(#a)" marker-end="url(#a)"/><text x="50.00" y="109.60" font-size="2.5" text-anchor="middle">220 wide</text><text x="50.00" y="158.77" font-size="1.7" text-anchor="middle">keel +40, R50 chine, R50 deck edge</text><text x="117.00" y="103.00" font-size="2.3" text-anchor="middle" font-weight="bold" style="fill:#2a7fbf">STATION 130</text><text x="117.00" y=
