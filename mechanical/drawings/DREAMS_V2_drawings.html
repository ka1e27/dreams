 y="20.00" font-size="3.0" text-anchor="start" font-weight="bold">MODULES</text><rect class="grid" x="216.00" y="23.00" width="194.00" height="20.00"/><line class="dimx" x1="216.00" y1="27.00" x2="410.00" y2="27.00"/><line class="dimx" x1="216.00" y1="31.00" x2="410.00" y2="31.00"/><line class="dimx" x1="216.00" y1="35.00" x2="410.00" y2="35.00"/><line class="dimx" x1="216.00" y1="39.00" x2="410.00" y2="39.00"/><line class="dimx" x1="242.00" y1="23.00" x2="242.00" y2="43.00"/><line class="dimx" x1="262.00" y1="23.00" x2="262.00" y2="43.00"/><text x="217.20" y="25.88" font-size="2.2" text-anchor="start" font-weight="bold">Module</text><text x="243.20" y="25.88" font-size="2.2" text-anchor="start" font-weight="bold">Design kg</text><text x="263.20" y="25.88" font-size="2.2" text-anchor="start" font-weight="bold">Contents</text><text x="217.20" y="29.88" font-size="2.2" text-anchor="start">Port tub</text><text x="243.20" y="29.88" font-size="2.2" text-anchor="start">3.2</text><text x="263.20" y="29.88" font-size="2.2" text-anchor="start">5 printed segments + bulkheads, flange with 37 M4 inserts, leak sensor. Bare float: no hardware</text><text x="217.20" y="33.88" font-size="2.2" text-anchor="start">Stbd tub</text><text x="243.20" y="33.88" font-size="2.2" text-anchor="start">3.2</text><text x="263.20" y="33.88" font-size="2.2" text-anchor="start">mirror of the port tub</text><text x="217.20" y="37.88" font-size="2.2" text-anchor="start">Upper module</text><text x="243.20" y="37.88" font-size="2.2" text-anchor="start">25.6</text><text x="263.20" y="37.88" font-size="2.2" text-anchor="start">bridge (arch frames, arms, hub: 4x M18, VESCs, Pi 5, radios, winch, pod) + 2 lids + 2 belt outdrives</text><text x="217.20" y="41.88" font-size="2.2" text-anchor="start">Boat</text><text x="243.20" y="41.88" font-size="2.2" text-anchor="start">32.0</text><text x="263.20" y="41.88" font-size="2.2" text-anchor="start">incl. 10% growth margin</text><text x="216.00" y="52.00" font-size="2.3" text-anchor="start" font-weight="bold">ASSEMBLY</text><text x="216.00" y="55.50" font-size="2.3" text-anchor="start">1. Bolt each foot to its lid from inside: 8x M6 x 60 up through the rib bosses, EPDM pad between.</text><text x="216.00" y="59.00" font-size="2.3" text-anchor="start">2. Bolt each outdrive to its lid&#x27;s aft deck: 4x M5 from inside.</text><text x="216.00" y="62.50" font-size="2.3" text-anchor="start">3. Press the 3 mm cord into each tub&#x27;s flange groove.</text><text x="216.00" y="66.00" font-size="2.3" text-anchor="start">4. Lower the bridge + lids onto the tubs; the drip lips locate on the tub flanges.</text><text x="216.00" y="69.50" font-size="2.3" text-anchor="start">5. Screw down the rails: 37 M4 per hull, 60 mm pitch within 150 mm of a frame, 100 elsewhere.</text><text x="216.00" y="73.00" font-size="2.3" text-anchor="start">6. Plug each motor cable into its arm&#x27;s IP68 connector. Nothing passes through a lid or tub.</text><text x="216.00" y="76.50" font-size="2.3" text-anchor="start"></text><text x="216.00" y="80.00" font-size="2.3" text-anchor="start">Waterlines: DWL 94 at 32.0 kg; thin blue = light 86 / max 105. Lid joint 96 above the DWL.</text><text x="216.00" y="83.50" font-size="2.3" text-anchor="start">Lids, drives and bridge lift off as one unit; the hub keeps the electronics clear of spray.</text><text x="216.00" y="87.00" font-size="2.3" text-anchor="start">Geometry comes from mechanical/hull_sizing.py; regenerate after changes.</text><text x="243.80" y="238.40" font-size="3.2" text-anchor="start" font-weight="bold">D.R.E.A.M.S V2 — autonomous survey catamaran</text><text x="243.80" y="243.40" font-size="3.0" text-anchor="start">General arrangement: plan, profile, view from astern</text><text x="243.80" y="250.40" font-size="2.2" text-anchor="start">All dimensions mm unless noted. Third-angle projection. Do not scale the print; build from the numbers.</text><text x="243.80" y="258.60" font-size="2.4" text-anchor="start">SCALE  1:10</text><text x="303.80" y="258.60" font-size="2.4" text-anchor="start">SHEET  1 OF 5</text><text x="363.80" y="258.60" font-size="2.4" text-anchor="start">REV  C (hull lids + belt outdrive)</text><text x="243.80" y="266.60" font-size="2.4" text-anchor="start">DATE  2026-09-27</text><text x="303.80" y="266.60" font-size="2.4" text-anchor="start">DRAWN  Claude Code for M. Hong</text><text x="363.80" y="266.60" font-size="2.4" text-anchor="start">SRC  mechanical/drawings.py</text></svg></div><div class="page"><svg xmlns="http://www.w3.org/2000/svg" width="431.8mm" height="279.4mm" viewBox="0 0 431.8 279.4"><style>

40" x2="420.00" y2="215.40"/><line class="dimx" x1="200.00" y1="219.00" x2="420.00" y2="219.00"/><line class="dimx" x1="209.00" y1="183.00" x2="209.00" y2="222.60"/><line class="dimx" x1="218.00" y1="183.00" x2="218.00" y2="222.60"/><text x="201.20" y="185.59" font-size="1.95" text-anchor="start" font-weight="bold">No.</text><text x="210.20" y="185.59" font-size="1.95" text-anchor="start" font-weight="bold">Qty</text><text x="219.20" y="185.59" font-size="1.95" text-anchor="start" font-weight="bold">Item</text><text x="201.20" y="189.19" font-size="1.95" text-anchor="start">1</text><text x="210.20" y="189.19" font-size="1.95" text-anchor="start">1</text><text x="219.20" y="189.19" font-size="1.95" text-anchor="start">Outrunner ~380 KV, 4108 size, &gt;= 25 A (e.g. SunnySky X4108S-380KV), on the slotted motor plate</text><text x="201.20" y="192.79" font-size="1.95" text-anchor="start">2</text><text x="210.20" y="192.79" font-size="1.95" text-anchor="start">2</text><text x="219.20" y="192.79" font-size="1.95" text-anchor="start">HTD 3M pulley, 20T (19.1 PD), for a 9 mm belt, 5 mm bore + set screw</text><text x="201.20" y="196.39" font-size="1.95" text-anchor="start">3</text><text x="210.20" y="196.39" font-size="1.95" text-anchor="start">1</text><text x="219.20" y="196.39" font-size="1.95" text-anchor="start">HTD 3M belt, 9 mm, 209 T (627 mm); 15 mm belt + pulleys for long runs at 3 m/s</text><text x="201.20" y="199.99" font-size="1.95" text-anchor="start">4</text><text x="210.20" y="199.99" font-size="1.95" text-anchor="start">1</text><text x="219.20" y="199.99" font-size="1.95" text-anchor="start">316 stainless shaft 5 mm, D-flat under the prop, M5 thread for the nylock</text><text x="201.20" y="203.59" font-size="1.95" text-anchor="start">5</text><text x="210.20" y="203.59" font-size="1.95" text-anchor="start">2</text><text x="219.20" y="203.59" font-size="1.95" text-anchor="start">625-2RS bearing, stainless (5 x 16 x 5)</text><text x="201.20" y="207.19" font-size="1.95" text-anchor="start">6</text><text x="210.20" y="207.19" font-size="1.95" text-anchor="start">1</text><text x="219.20" y="207.19" font-size="1.95" text-anchor="start">M5 nylock A4 + washer</text><text x="201.20" y="210.79" font-size="1.95" text-anchor="start">7</text><text x="210.20" y="210.79" font-size="1.95" text-anchor="start">1</text><text x="219.20" y="210.79" font-size="1.95" text-anchor="start">Tilt pin M6 A4 + 2 flanged bushings; spring-plunger detent that holds reverse thrust</text><text x="201.20" y="214.39" font-size="1.95" text-anchor="start">8</text><text x="210.20" y="214.39" font-size="1.95" text-anchor="start">4</text><text x="219.20" y="214.39" font-size="1.95" text-anchor="start">M5 x 20 A4 + washers: bracket to the lid deck, from inside the lid</text><text x="201.20" y="217.99" font-size="1.95" text-anchor="start">9</text><text x="210.20" y="217.99" font-size="1.95" text-anchor="start">1</text><text x="219.20" y="217.99" font-size="1.95" text-anchor="start">Printed in ASA: bracket, tilt head, cover, leg halves (M3 screws), pod</text><text x="201.20" y="221.59" font-size="1.95" text-anchor="start">10</text><text x="210.20" y="221.59" font-size="1.95" text-anchor="start">1</text><text x="219.20" y="221.59" font-size="1.95" text-anchor="start">Prop 110: props/toroidal_3loop_p75_RH_shaft (stbd) / _LH_shaft (port), or a 110 mm RC prop</text><text x="236.00" y="18.00" font-size="1.9" text-anchor="start" font-weight="bold">OUTDRIVE NOTES</text><text x="236.00" y="21.10" font-size="1.9" text-anchor="start">- The leg and pod free-flood, so the belt and both bearings run wet: stainless bearings, a PU belt with aramid or stainless cords, and a fresh-water rinse after use.</text><text x="236.00" y="24.20" font-size="1.9" text-anchor="start">- Tension the belt by sliding the motor up its slotted plate. The whole drive tilts about the pin, so a kick-up doesn&#x27;t change the tension.</text><text x="236.00" y="27.30" font-size="1.9" text-anchor="start">- Forward thrust holds the leg on its rubber stop; the detent holds it against reverse thrust (differential steering) and lets go when the leg hits something.</text><text x="236.00" y="30.40" font-size="1.9" text-anchor="start">- The leg is split on its chord plane so the belt goes in whole. Motor wires run up the arm fairing to the hub; nothing passes through the lid.</text><text x="236.00" y="33.50" font-size="1.9" text-anchor="start">- Stbd prop RH, port prop LH (tops turn outboard). A 9 mm belt is near its rating at full speed; cruise is well inside it.</text><text x="243.80" y="238.40" font-size="3.2" text-anchor="start" font-weight="bold">D.R.E.A.M.S V2 — autonomous survey catamaran</text><text x="243.80" y="243.40" font-size="3.0" text-anchor="start">Hull lid joint (rail) and belt outdrive</text><text x="243.80" y="250.40" font-size="2.2" text-anchor="start">All dimensions mm unless noted. Third-angle projection. Do not scale the print; build from the numbers.</text><text x="243.80" y="258.60" font-size="2.4" text-anchor="start">SCALE  as noted</text><text x="303.80" y="258.60" font-size="2.4" text-anchor="start">SHEET  4 OF 5</text><text x="363.80" y="258.60" font-size="2.4" text-anchor="start">REV  C (hull lids + belt outdrive)</text><text x="243.80" y="266.60" font-size="2.4" text-anchor="start">DATE  2026-09-27</text><text x="303.80" y="266.60" font-size="2.4" text-anchor="start">DRAWN  Claude Code for M. Hong</text><text x="363.80" y="266.60" font-size="2.4" text-anchor="start">SRC  mechanical/drawings.py</text></svg></div><div class="page"><svg xmlns="http://www.w3.org/2000/svg" width="431.8mm" height="279.4mm" viewBox="0 0 431.8 279.4"><style>

ODY PLAN (SHEET 2)</text><text x="250.00" y="23.35" font-size="2.1" text-anchor="start">Each coloured shape is one slice straight across ONE hull, like a slice of</text><text x="250.00" y="26.70" font-size="2.1" text-anchor="start">bread. Its number is where the slice is: mm forward of the transom.</text><text x="250.00" y="30.05" font-size="2.1" text-anchor="start"></text><text x="250.00" y="33.40" font-size="2.1" text-anchor="start">Sheet 2 stacks all the slices on one drawing. The hull is the same on both</text><text x="250.00" y="36.75" font-size="2.1" text-anchor="start">sides, so it draws only half of each slice: the stern half of the boat on</text><text x="250.00" y="40.10" font-size="2.1" text-anchor="start">the left of the centreline, the bow half on the right, in these colours.</text><text x="250.00" y="43.45" font-size="2.1" text-anchor="start"></text><text x="250.00" y="46.80" font-size="2.1" text-anchor="start">Reading from stern to bow:</text><text x="250.00" y="50.15" font-size="2.1" text-anchor="start">- 0 to 520: the same shape, but the keel lifts toward the transom</text><text x="250.00" y="53.50" font-size="2.1" text-anchor="start">  (+40 mm at 0), so the stern draws less water.</text><text x="250.00" y="56.85" font-size="2.1" text-anchor="start">- 520 to 650: the widest part (220 mm), keel on the baseline.</text><text x="250.00" y="60.20" font-size="2.1" text-anchor="start">- 650 to 1300: it narrows toward the bow; from 910 the keel</text><text x="250.00" y="63.55" font-size="2.1" text-anchor="start">  also rises, to +100 at the bow, which ends in a 10 mm flat face.</text><text x="250.00" y="66.90" font-size="2.1" text-anchor="start"></text><text x="250.00" y="70.25" font-size="2.1" text-anchor="start">In each box: blue dashes = waterline (94), purple = lid joint (190).</text><text x="250.00" y="73.60" font-size="2.1" text-anchor="start">In SolidWorks, each box is one sketch on a plane at that x (guide, A2).</text><text x="50.00" y="103.00" font-size="2.3" text-anchor="middle" font-weight="bold" style="fill:#1f4e9c">STATION 0</text><text x="50.00" y="106.30" font-size="1.7" text-anchor="middle">the transom itself</text><line class="thin" x1="29.17" y1="155.17" x2="70.83" y2="155.17"/><line class="wl" x1="29.17" y1="139.46" x2="70.83" y2="139.46"/><line class="lidj" x1="29.17" y1="123.50" x2="70.83" y2="123.50"/><line class="ctr" x1="50.00" y1="156.50" x2="50.00" y2="112.83"/><polygon class="vis" style="stroke:#1f4e9c;fill:#1f4e9c;fill-opacity:0.12" points="50.00,148.50 51.97,148.08 53.93,147.66 55.90,147.25 57.87,146.83 59.83,146.41 61.80,145.99 62.88,145.68 63.91,145.23 64.86,144.65 65.73,143.94 66.49,143.11 67.14,142.20 67.65,141.20 68.03,140.14 68.26,139.04 68.33,137.92 68.33,135.90 68.33,133.88 68.33,131.86 68.33,129.84 68.33,127.81 68.33,125.79 68.33,123.77 68.33,121.75 68.05,119.61 67.23,117.62 65.92,115.92 64.21,114.61 62.22,113.78 60.08,113.50 58.07,113.50 56.05,113.50 54.03,113.50 52.02,113.50 50.00,113.50 47.98,113.50 45.97,113.50 43.95,113.50 41.93,113.50 39.92,113.50 37.78,113.78 35.79,114.61 34.08,115.92 32.77,117.62 31.95,119.61 31.67,121.75 31.67,123.77 31.67,125.79 31.67,127.81 31.67,129.84 31.67,131.86 31.67,133.88 31.67,135.90 31.67,137.92 31.74,139.04 31.97,140.14 32.35,141.20 32.86,142.20 33.51,143.11 34.27,143.94 35.14,144.65 36.09,145.23 37.12,145.68 38.20,145.99 40.17,146.41 42.13,146.83 44.10,147.25 46.07,147.66 48.03,148.08"/><line class="dimx" x1="31.67" y1="120.75" x2="31.67" y2="108.90"/><line class="dimx" x1="68.33" y1="120.75" x2="68.33" y2="108.90"/><line class="dim" x1="31.67" y1="110.40" x2="68.33" y2="110.40" marker-start="url(#a)" marker-end="url(#a)"/><text x="50.00" y="109.60" font-size="2.5" text-anchor="middle">220 wide</text><text x="50.00" y="158.77" font-size="1.7" text-anchor="middle">keel +40, R50 chine, R50 deck edge</text><text x="117.00" y="103.00" font-size="2.3" text-anchor="middle" font-weight="bold" style="fill:#2a7fbf">STATION 130</text><text x="117.00" y=
