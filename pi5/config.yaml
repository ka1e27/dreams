# Pi 5 Autonomous Boat Configuration
# ------------------------------------

serial:
  # USB serial port to Boat Pico
  port: "/dev/ttyACM0"
  baud: 115200
  # Timeout for waiting for ACK/NAK after sending a command (ms)
  command_timeout_ms: 2000
  # Number of retries before declaring command failure
  max_retries: 3
  # On run_hardware.py startup, upload firmware/boat-pico/*.py to the Pico via
  # mpremote and reset it before connecting. Set false to skip (e.g. during
  # firmware dev when you flash manually).
  deploy_on_start: true

heartbeat:
  # Interval between HB messages sent to Boat Pico (seconds)
  interval_s: 1.0
  # Pico-side timeout is 3s — keep interval well under that

navigation:
  # Distance (metres) at which the boat is considered "arrived" at a waypoint
  arrive_radius_m: 5.0
  # Distance before re-acquiring a hold position (metres)
  hold_drift_m: 8.0
  # Default throttle during waypoint transit (0–100)
  cruise_throttle: 40
  # Heading tolerance — below this error, go straight (degrees)
  heading_tolerance_deg: 10.0
  # Max heading error for proportional steering (degrees)
  max_heading_error_deg: 90.0
  # Minimum turn throttle (prevents stalling during sharp turns)
  turn_min_throttle: 15
  # Navigation update rate (Hz)
  update_rate_hz: 5
  # ---- Line-of-sight (LOS) path following ----
  # Steer to a lookahead point on the track line between waypoints instead of
  # pointing straight at the next waypoint, so wind/current can't build up
  # cross-track drift. See pi5/navigation/geo.py:los_course.
  los_enabled: true
  # Lookahead distance Δ (m): smaller = snap back to the track harder; larger =
  # gentler. ~3–8 boat lengths is typical. At cross-track error = Δ the boat
  # aims 45° back toward the line.
  los_lookahead_m: 12.0
  # Integral LOS (ILOS) gain — > 0 cancels steady cross-track bias from a
  # constant current/wind (Lekkas & Fossen). 0 = pure lookahead LOS (no windup
  # risk); enable a small value (e.g. 0.02) after field tuning on a flowing river.
  los_integral_gain: 0.0
  # Anti-windup clamp for the ILOS integrator (metre·seconds).
  los_integral_clamp: 60.0
  # ---- Per-motor thrust trim (mismatched motors) ----
  # The twin 2814 drive motors may have different Kv, so equal command gives
  # unequal thrust and the boat crabs. These gains scale each motor's command
  # before it's sent. 1.0 = no trim. Bench-calibrate: run both at equal command,
  # and lower the gain of whichever motor is faster until it tracks straight.
  motor_gain_left: 1.0
  motor_gain_right: 1.0
  # ---- Water-current estimation + station-keeping (stay mode) ----
  # The boat has no water-speed sensor, so it estimates the current as
  # (GPS ground velocity − modelled through-water velocity). The model is
  # v = thrust_a*|thr| + thrust_b*thr²  (thr = mean forward command, −1..1);
  # calibrate per boat (drive known throttles in still water, fit the curve).
  current_enabled: true
  current_thrust_a: 0.35
  current_thrust_b: 0.15
  # Active station-keeping: in stay/hold mode the boat noses INTO the estimated
  # current and holds position (required through-water velocity = desired ground
  # velocity toward the hold point − current), instead of drifting to the edge of
  # hold_drift_m and lunging back. Tune on the water.
  sk_pos_gain: 0.25          # desired ground speed per metre of position error (1/s)
  sk_max_speed: 0.8          # cap on the station-keeping ground speed (m/s)
  sk_deadband_m: 1.2         # inside this radius + negligible current → idle motors
  sk_min_water_speed: 0.04   # required through-water speed below which → idle
  sk_speed_gain: 90.0        # throttle (0-100) per m/s of required through-water speed

mission:
  # Default max time at a data waypoint if not specified (seconds)
  default_sample_timeout_s: 300
  # Winch descent speed sent to Pico (-100 to 100, positive = down)
  winch_down_speed: 50
  # Winch ascent speed
  winch_up_speed: -50
  # Estimated descent rate (metres/second) for depth estimation
  descent_rate_m_per_s: 0.10
  # Margin multiplier for winch-up time (1.5 = 50% longer than descent)
  winch_up_margin: 1.5
  # Bottom contact confirmations needed before sampling
  bottom_confirm_count: 3
  # Seconds between bottom samples
  sample_interval_s: 5.0
  # Consecutive no-contact reads to confirm lift-off
  bottom_lost_confirm: 3
  # Minimum samples before allowing lift-off exit
  min_bottom_samples: 2
  # Pod poll interval during sampling (seconds)
  pod_poll_interval_s: 2.0

pod:
  # Pod poll interval during transit (seconds)
  poll_interval_s: 5.0
  # Timeout before declaring pod lost (ms)
  timeout_ms: 10000

battery:
  # Three fully isolated Milwaukee M18 domains — see docs/battery_architecture.md.
  # Drive battery — TEST BENCH: 2× M18 in PARALLEL (18 V nom / 21 V full / 15 V
  # cutoff) for the twin 2814 motors. Parallel = one pack's voltage, double the
  # current/runtime — NOT more voltage (so it's ~18 V, below 6S LiPo's 22 V).
  # These thresholds are a SINGLE M18's (same as elec/winch). Firmware mirror:
  # firmware/boat-pico/sensors.py P_* constants (the authoritative copy).
  drive:
    full_v: 21.0
    empty_v: 15.0
    warn_v: 17.0
    critical_v: 16.0
  # Electronics battery — 1× M18 standalone (18 V nominal / 21 V full)
  elec:
    full_v: 21.0
    empty_v: 15.0
    warn_v: 17.0
    critical_v: 16.0
  # Winch battery — 1× M18 standalone (18 V nominal / 21 V full)
  winch:
    full_v: 21.0
    empty_v: 15.0
    warn_v: 17.0
    critical_v: 16.0

network:
  # Connection mode for cloud uploads + remote access:
  #   "wifi"     — use the Pi's built-in WiFi only (best for shore / dev work)
  #   "cellular" — use the SIM7600 4G modem (default for autonomous missions)
  #   "auto"     — prefer WiFi if associated, fall back to cellular
  mode: "auto"

  # WiFi credentials. If both ssid and password are set, the network helper
  # configures NetworkManager (nmcli) on first run; otherwise it assumes the
  # OS already has WiFi configured.
  wifi:
    ssid: ""
    password: ""

  cellular:
    # SIM7600 modem configuration. The OS is expected to bring this up
    # (NetworkManager / mmcli / wvdial) — we just record the parameters.
    device: "/dev/ttyUSB2"
    baud: 115200
    apn: "internet"

  # API endpoint for cloud data upload — used regardless of which transport
  # is currently active.
  cloud_api_url: "https://your-cloud-api.example.com/api/v1"
  cloud_api_key: ""  # Set via environment variable BOAT_CLOUD_API_KEY
  # Upload interval (seconds) — buffer locally if offline
  upload_interval_s: 30
  # Probe URL used to confirm the link is actually usable (HEAD request).
  # Default is the cloud API root.
  online_probe_url: ""

camera:
  # Stereo USB cameras for distance-aware obstacle avoidance.
  # NOTE: each UVC camera exposes TWO /dev/video* nodes — an even one for image
  # capture and the next ODD one for metadata only (opens fine but yields no
  # frames). Use only the EVEN capture nodes. `v4l2-ctl --list-devices` here
  # shows cam A = video2/3 and cam B = video0/1, so the capture indices are 0
  # and 2 (NOT 1 — video1 is cam B's metadata node and never delivers frames).
  # These are the DEFAULTS — the command center's camera DEV L/R controls can
  # reassign left/right live (POST /api/camera/devices); that choice persists
  # to pi5/server/camera_devices.json and overrides these on the next start.
  left_device: 0
  right_device: 2
  baseline_m: 0.32
  calibration_path: "pi5/cv/calibration.npz"
  # StereoSGBM cost scales with resolution × disparity range, so at 1080p it
  # dominates the whole inference budget on a Pi 5 (hundreds of ms/frame) and
  # collapses detection FPS whenever an object is in view. Run the matcher at
  # this fraction of full res — depth stays metrically correct (the reprojection
  # matrix is rescaled, see pi5/cv/stereo.py) and mid-range (3-30 m) accuracy is
  # essentially unchanged. 0.5 ≈ 4× faster; set 1.0 to force full resolution.
  stereo_downscale: 0.5
  # WLS disparity post-filter (needs opencv-contrib-python for cv2.ximgproc).
  # Water is the worst case for block matching — textureless, specular — so raw
  # SGBM leaves big invalid holes on the surface. WLS fills/smooths them via a
  # left↔right consistency check, at the cost of a second matcher pass (~2×
  # matching time). Off by default; enable on a rig that can spare the cycles
  # (or drop stereo_downscale / stereo FPS to compensate). See pi5/cv/stereo.py.
  stereo_wls: false
  # Capture settings (CameraProducer). Changing these needs a restart.
  # ---- Arducam 8MP IMX219 (fixed focus) notes ----
  # The IMX219 is a raw sensor (no onboard JPEG). Its native 8MP mode is
  # 3280x2464, which over USB runs at only ~5 fps. If the feed is stuck at ~5
  # fps the camera ignored the format set below and is reading full 8MP — on
  # Linux we now force the V4L2 backend (pi5/cv/camera.py) so the resolution +
  # format switch actually applies and it drops to the fast binned mode here.
  # IMX219 binned modes that hit a high frame rate: 640x480, 1280x720 @ 30+,
  # 1640x1232 @ 30. Run `v4l2-ctl -d /dev/video0 --list-formats-ext` to see the
  # exact modes/formats your module advertises, and set width/height/fps to one.
  width: 1280
  height: 720
  fps: 30            # capture rate; the camera must support it at this res+format
  # NOTE: uncompressed YUY2 at 1080p30 needs ~1 Gbit/s per camera — USB 3.0
  # port/hub required for both cameras simultaneously. If frames stall or fps
  # drops, switch fourcc to "MJPG" below (compressed, far lighter over USB).
  # Pixel format (FourCC) requested from the camera:
  #   "YUY2"  — uncompressed 4:2:2 (V4L2 calls it YUYV; the code maps YUY2→YUYV
  #             on Linux). No JPEG decode cost and it dodges the camera's MJPG
  #             framerate caps — but ~16 bits/pixel, so it's bandwidth-heavy:
  #             1080p30 ≈ 1 Gbit/s (USB 3.0 only); fine at 720p / 640x480.
  #   "MJPG"  — compressed; light over USB but the module may cap its MJPG modes
  #             (e.g. 1080p only at 15 fps).
  #   ""      — leave the camera in its default format.
  fourcc: "MJPG"
  # If the camera stops delivering frames (USB unplugged, driver hiccup), the
  # producer releases it and retries reopening the same /dev/video* index this
  # often (seconds) until it returns. The feed shows NO-SIGNAL meanwhile and
  # recovers on its own — no restart needed.
  reconnect_interval_s: 2.0
  # ---- Command-center video feed (runtime-adjustable from /command) ----
  # Stream publish-rate cap (JPEG encode/send). Lower = lighter CPU. Capped to
  # the capture rate above; raise/lower live with the STREAM FPS slider.
  stream_fps: 30
  # MJPEG encode quality 0-100.
  jpeg_quality: 60
  # Live YOLO detection overlay drawn on the /video feed.
  detection:
    enabled: true
    # Model weights. Default COCO yolov8n (has 'boat','person',…). Two ways to
    # specialise for the water:
    #   1. The ml/ pipeline trains a maritime model and exports it to
    #      pi5/cv/models/maritime_yolov8n.onnx — if that file exists it is used
    #      automatically (onnxruntime backend, no torch), no config edit needed.
    #   2. Otherwise drop a maritime .pt here, or an NCNN export dir
    #      (yolov8n_ncnn_model, ~2x faster on ARM). Ultralytics infers the format.
    # Active: generic COCO yolov8n exported to NCNN (Tencent's ARM-optimised
    # engine) — measured ~2x faster than ONNX on the Pi 5 CPU (34 vs 18 fps @
    # imgsz 320), detecting person/boat/… with no torch at runtime. The same
    # model as pi5/cv/models/yolov8n.onnx is kept alongside as a fallback: if the
    # `ncnn` package is unavailable, point this at "pi5/cv/models/yolov8n.onnx".
    # A trained maritime model (pi5/cv/models/maritime_*.onnx or _ncnn_model/)
    # can be dropped in and pointed to here. NB the on-Pi maritime fine-tune
    # (docs) underperformed COCO on people, so COCO is the shipped detector.
    model: "pi5/cv/models/yolov8n_ncnn_model"
    # Inference size (mult of 32). 320 is the sweet spot for the Pi 5 CPU: it's
    # what keeps YOLO in the "lower but high" FPS band alongside the 15 fps Tier-1
    # water screen. 416/640 see smaller/farther targets but cost proportionally
    # more per frame (the real lever on detection FPS — detect_max_fps only caps).
    imgsz: 320
    conf: 0.40            # min confidence to keep a detection
    # Upper cap on inference rate (decoupled from Tier-1 seg and the video stream).
    # Actual FPS = min(this, 1 / inference_time). With the NCNN backend yolov8n@320
    # runs ~34 fps on the Pi 5, so we lift the cap to 15 (matching the Tier-1 water
    # screen / camera rate) for more detection frames while stereo/nav keep headroom.
    detect_max_fps: 15
    target_classes: []    # keep only these class names; [] = keep all
    # Highlighted (amber) classes — covers both the COCO fallback ('boat','person')
    # and the maritime model ('vessel','kayak'). Others are drawn muted.
    # Highlighted (amber) classes — attention targets. Superset covering the COCO
    # fallback ('boat','person') and the maritime model ('boats','sail-boat',
    # 'surfer','vessel','kayak'). Matching is case-insensitive (vision_overlay),
    # so lowercase entries match 'Sail-Boat'/'Person' from either backend.
    highlight_classes: ["vessel", "boat", "boats", "sail-boat", "sailboat", "kayak", "surfer", "person"]
    # Default class for the lock reticle / radar bar to follow. "" = AUTO (the
    # highest-confidence highlighted target). Changeable live from the command
    # center's TRACK picker (which also retargets the radar bar).
    track_class: ""

vision:
  # Three-tier survey vision pipeline (pi5/cv/pipeline.py). This LAYERS on the
  # existing detection overlay + radar tracker — it does NOT run a second YOLO.
  #   Tier 1  water segmentation  — cheap, always-on anomaly screen
  #   Tier 2  the existing YOLO overlay — gated ON only when Tier 1 sees an anomaly
  #   Tier 3  threat assessment    — distance + approach vector → drives the radar
  # --- Tier-1 water screen (PRIMARY, always-on, 15 fps target) ---
  # Leave EMPTY for the classical OpenCV HSV/edge screen — the only backend that
  # sustains 15 fps on a Pi 5 CPU, and the recommended primary. Set a path ONLY
  # to replace the fast screen entirely (backend from the extension: .onnx →
  # onnxruntime, .tflite → tflite_runtime/tensorflow).
  seg_model_path: ""
  # --- Tier-1b HYBRID confirmation (optional, slow, higher-accuracy) ---
  # A DNN water model (eWaSR — see docs/water_vision.md) run on a SEPARATE slow
  # loop so it never stalls the 15 fps screen. It becomes the authoritative
  # water_state and can wake YOLO on obstacles the HSV screen misses (fail-safe:
  # it only ever ADDS triggers, never suppresses them). Absent/empty file → hybrid
  # off (pure classical). On a Pi 5 CPU keep the rate low (1-2 Hz); a Hailo
  # accelerator (ONNX-native) would let it run much faster. Drop the eWaSR export
  # at this path (gitignored) to activate — nothing else to change.
  seg_confirm_model_path: "pi5/cv/models/water_seg.onnx"
  seg_confirm_max_fps: 2      # spot-check cadence (Hz) — keep low on a CPU
  seg_confirm_ttl_s: 3        # trust a verdict this long before it goes stale
  # --- Segmentation model knobs (apply to whichever seg model loads; ignored by
  #     the classical screen) ---
  # Which output class index is "water"; non-water pixels drive the anomaly score.
  # Default 1 matches WaSR/eWaSR (0=obstacle, 1=water, 2=sky).
  seg_water_class: 1
  # Class indices excluded from the anomaly ratio (e.g. sky) so they don't inflate
  # it. For 3-class WaSR/eWaSR, [2] drops sky.
  seg_ignore_classes: [2]
  # Input normalisation: "imagenet" (WaSR/torchvision convention) or "01" (/255).
  seg_normalize: "imagenet"
  # Optional [w, h] input override when the model exports dynamic axes.
  # seg_input_size: [512, 384]
  # Fraction of the frame that must read as non-water to wake Tier 2 (YOLO).
  anomaly_trigger_threshold: 0.15
  # Once triggered, keep YOLO active this many frames before it can idle again
  # (hysteresis so it doesn't flicker on/off as the anomaly crosses threshold).
  yolo_cooldown_frames: 5
  # Gate YOLO on the Tier-1 anomaly trigger (true = real tiering, saves CPU when
  # the water is clear). Set false to keep the detection overlay always-on
  # (classic behaviour) and use the YOLO toggle as a simple on/off.
  gate_yolo_on_anomaly: true
  # Tier-1 water-analysis rate cap (Hz) — the "water detection at 15 fps" target.
  # The classical screen is cheap (downscaled HSV) and easily sustains this; it's
  # fully decoupled from the video stream and the YOLO detect rate, so holding it
  # at 15 (rather than higher) leaves more CPU for YOLO without starving the
  # always-on water screen.
  tier1_max_fps: 15
  # Camera horizontal FOV — for mapping a bbox to a bearing (bbox → radar angle).
  fov_degrees: 75

  # --- Persistent GPS-anchored object memory (pi5/cv/object_memory.py) ---
  # Geolocates confirmed detections (boat fix + heading + bbox bearing + stereo
  # range) and remembers them as markers on the map. A marker only drops once an
  # object has been seen enough times to CONFIRM it; further sightings just refine
  # the stored coordinate (inverse-distance weighted — closer looks count more).
  # Buoys/docks/rocks are PERMANENT (kept); people/boats/debris are TRANSIENT
  # (forgotten transient_ttl_s after they're last seen). Class→category lives in
  # object_memory.py. Needs stereo range, so it's a no-op on a mono rig.
  object_memory:
    enabled: true
    confirm_sightings: 3        # agreeing looks before a marker drops (anti-false-positive)
    match_radius_m: 6.0         # base spatial gate for "same object" (metres)
    match_radius_frac: 0.08     # + this × range (far fixes are noisier → wider gate)
    match_radius_max_m: 25.0    # cap on the gate
    transient_ttl_s: 45.0       # forget a confirmed person/boat this long after last seen
    candidate_ttl_s: 12.0       # drop an unconfirmed candidate this fast (noise)
    permanent_ttl_s: 0.0        # 0 = keep buoys/docks for the whole session
    max_range_m: 60.0           # ignore detections ranged beyond this (stereo unreliable)
    min_confidence: 0.30        # ignore detections below this confidence
    max_objects: 200            # memory cap (drops least-valuable first)
    # Once a landmark is charted, don't lock the radar bar re-observing it — keep
    # scanning for the unknown even with known things nearby (CRITICAL threats
    # like vessels/people are always tracked regardless).
    release_radar_on_known: true

  threat_tracking:
    enabled: true
    # Class → threat level lives in pi5/cv/threat_assessor.py (THREAT_LEVELS).
    # CRITICAL (vessel/boat/person/kayak) always tracks; WARNING (debris/buoy)
    # tracks only if approaching; INFO/SURVEY never track.
    approach_detection_frames: 5
    approach_size_threshold: 1.10   # 10% apparent-size growth = APPROACHING
    track_warning_if_approaching: true
    mission_alert_distance_m: 30.0  # raise a mission alert when a CRITICAL threat is this close
    # After a threat clears, hold then return the radar to SCAN after this long.
    clear_timeout_s: 5.0

  survey_logging:
    # INFO/SURVEY detections are counted and (if a CloudUploader is wired)
    # uploaded; CRITICAL/WARNING go to the threat system instead.
    min_confidence: 0.6
    min_anomaly_score: 0.20
    min_interval_s: 5.0             # per-class rate limit so a static dock doesn't spam

  reactive_avoidance:
    # When the primary threat (CRITICAL/WARNING) enters the envelope, the
    # pipeline pushes a steer-away override into the navigator that overrides
    # waypoint steering until the threat clears (pi5/cv/avoidance.py). This is
    # what actually keeps the boat off obstacles — it reuses the threats the
    # pipeline already tracks (no second YOLO). Range prefers stereo depth and
    # falls back to a coarse monocular bbox-size proxy on a single-camera rig.
    enabled: true
    trigger_distance_m: 8.0    # start bearing away at this range (m)
    critical_distance_m: 3.0   # full-authority hard turn at this range (m)
    # cruise_throttle: defaults to navigation.cruise_throttle if unset.
    max_steer: 65              # peak differential steer at full severity
    head_on_deg: 8.0           # |bearing| under this = head-on → pass to starboard (COLREGS)
    # Forward-throttle floor at full severity. A small floor makes the boat ARC
    # around a hazard instead of stopping (stopping lets path-following pull it
    # straight back at the obstacle — a reactive local minimum). 0 = may stop.
    min_forward_frac: 0.2
    # Bug-style escape (AvoidanceController): commit to a side and PASS the hazard
    # rather than orbiting one sitting on the goal line.
    pass_bearing_deg: 110.0    # |bearing| behind the beam → tracked hazard is passed → release
    pass_hold_s: 6.0           # when sight is lost, hold the maneuver this long to finish the pass

  # --- Incoming-wave / swell detection (capsize avoidance) ---
  # A cheap horizon-tracking + optical-flow-looming watch (pi5/cv/wave_detector.py)
  # on the Tier-1 loop (~3 ms/frame). Raises an early WAVE alert with a bearing +
  # severity; when a big set is imminent the boat bows into it (turn to face,
  # ease throttle) — the seamanship response to avoid a beam-on capsize. Tune the
  # trigger on the water (whitecaps/glare/wake can false-trigger; the persistence
  # state machine and smoothing absorb short transients).
  wave_detection:
    enabled: true
    max_fps: 10                # analysis-rate cap (Hz)
    trigger_severity: 0.55     # fused severity (0-1) above which a wave is "incoming"
    response_enabled: true     # auto bow-into-wave (yields to obstacle avoidance)
    turn_severity: 0.6         # severity above which the boat actively turns to face
    turn_gain: 50              # peak differential steer for the bow-in pivot
    turn_min: 20               # minimum pivot authority once triggered

stepper:
  # Radar-bar pan stepper (A4988 + NEMA-17) driven from the Pi 5 GPIO header
  # directly via gpiozero/lgpio. This is the ONLY Pi 5 GPIO use in the project
  # (everything else is USB) — see docs/pin_map.md. Pins are BCM numbers.
  step_pin: 23
  dir_pin: 24
  enable_pin: 25         # active-LOW
  sleep_pin: 8           # active-LOW
  # RESET (active-LOW) MUST be HIGH or the A4988 ignores every STEP pulse — the
  # most common "driver looks alive but the motor never moves" cause. Default
  # (null) assumes RESET is jumpered to SLEEP on the board (recommended, no extra
  # Pi pin). Set this to a BCM pin number to instead drive RESET from the Pi
  # (the driver then holds it HIGH while energised). See docs/pin_map.md.
  reset_pin: null
  steps_per_rev: 3200    # 200 × 16 (1/16 microstepping wired on the A4988)
  max_rpm: 10
  auto_sleep_seconds: 5
  # has_slip_ring gates *wrapping* (taking the short way across 0°/360°), which
  # only a slip ring can survive. It does NOT cap manual travel — that's
  # manual_*_degrees below. With no slip ring the bar is a linear axis with hard
  # stops at each end, so it never winds the cable more than one turn.
  has_slip_ring: false
  # Auto-scan sweep range (SCAN mode hunts back and forth between these).
  sweep_min_degrees: 0
  sweep_max_degrees: 180
  # Manual pan / GOTO travel range — the operator can lock the bar anywhere in
  # here from the command center. Full 0–360° by default. ⚠ Without a slip ring
  # reaching the far end winds the radar cable up to one full turn; keep this at
  # 180 (or fit a slip ring) if that's a problem for your cable run.
  manual_min_degrees: 0
  manual_max_degrees: 360
  scan_speed_rpm: 3      # sweep speed while hunting for targets
  track_speed_rpm: 8     # slew speed while following a locked target
  fov_degrees: 75        # camera horizontal FOV, for bbox→bearing mapping
  # Detected classes that trigger TRACK mode (must match the YOLO model labels).
  # Covers the COCO fallback ('boat','person') + the maritime model ('vessel','kayak').
  priority_classes: ["vessel", "person", "kayak", "boat"]
  # Mode at startup: SLEEP (default, motor off) | HOLD | SCAN.
  initial_mode: "SLEEP"

winch:
  # Survey | Fishing — affects only dashboard labelling. Spool is a manual
  # mechanical swap; firmware behavior is identical in either mode.
  mode: "survey"

server:
  # FastAPI web server (dashboard + API)
  host: "0.0.0.0"
  port: 8000
  # API key for authenticating shore commands
  api_key: ""  # Set via environment variable BOAT_API_KEY
  # CORS allowed origins (dashboard URL)
  cors_origins:
    - "http://localhost:5173"
    - "http://localhost:3000"

logging:
  # Local CSV log file for sensor data
  data_log: "/home/pi/boat/data/survey.csv"
  # Log level: DEBUG, INFO, WARNING, ERROR
  level: "INFO"
