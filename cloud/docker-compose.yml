services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: boat
      POSTGRES_PASSWORD: boat
      POSTGRES_DB: boatdata
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boat -d boatdata"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://boat:boat@db:5432/boatdata
      CLOUD_API_KEY: ${CLOUD_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
